<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dashboard | Módulo de Cobros</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet" />
    <style>
      :root {
        --ink: #172033;
        --muted: #687386;
        --line: #e4e8ed;
        --navy: #172b3a;
        --orange: #f28c28;
        --green: #18794e;
        --red: #b6413c;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        margin: 0;
        padding: 32px;
        color: var(--ink);
        font-family: "DM Sans", sans-serif;
        background: #eef2f4;
        background-image: radial-gradient(#c9d4d7 1px, transparent 1px), linear-gradient(135deg, #f8faf9, #e7edef);
        background-size: 22px 22px, 100% 100%;
      }

      .page {
        width: min(100%, 1120px);
        margin: 0 auto;
      }

      .header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 24px;
        padding: 25px 30px;
        border-radius: 16px;
        color: white;
        background: var(--navy);
        box-shadow: 0 16px 30px rgba(23, 43, 58, 0.18);
        animation: appear 500ms ease-out both;
      }

      .header-copy {
        display: flex;
        align-items: center;
        gap: 15px;
      }

      .header-mark {
        display: grid;
        width: 42px;
        height: 42px;
        flex: 0 0 42px;
        place-items: center;
        border-radius: 11px;
        color: var(--navy);
        background: var(--orange);
        font-family: "Space Grotesk", sans-serif;
        font-size: 20px;
        font-weight: 700;
      }

      .header h1 {
        margin: 0;
        font-family: "Space Grotesk", sans-serif;
        font-size: 21px;
      }

      .header p {
        margin: 4px 0 0;
        color: #b8c4cb;
        font-size: 13px;
      }

      .logout {
        padding: 11px 16px;
        border-radius: 8px;
        color: white;
        text-decoration: none;
        background: var(--orange);
        font-size: 14px;
        font-weight: 700;
        transition: background 180ms ease, transform 180ms ease;
      }

      .logout:hover {
        background: #d87517;
        transform: translateY(-1px);
      }

      .card {
        margin-top: 24px;
        padding: 30px;
        border: 1px solid rgba(255, 255, 255, 0.9);
        border-radius: 16px;
        background: rgba(255, 255, 255, 0.94);
        box-shadow: 0 18px 45px rgba(29, 47, 61, 0.1);
        animation: appear 500ms 100ms ease-out both;
      }

      .card h2 {
        margin: 0;
        font-family: "Space Grotesk", sans-serif;
        font-size: 24px;
      }

      .card > p {
        margin: 7px 0 24px;
        color: var(--muted);
        font-size: 14px;
      }

      .table-wrapper {
        overflow-x: auto;
        border: 1px solid var(--line);
        border-radius: 10px;
      }

      table {
        width: 100%;
        min-width: 580px;
        border-collapse: collapse;
      }

      th,
      td {
        padding: 16px 18px;
        text-align: left;
        border-bottom: 1px solid var(--line);
        font-size: 14px;
      }

      th {
        color: #667385;
        background: #f5f7f8;
        font-size: 12px;
        letter-spacing: 0.06em;
        text-transform: uppercase;
      }

      tbody tr:last-child td {
        border-bottom: 0;
      }

      tbody tr:hover {
        background: #fbfcfc;
      }

      .status {
        display: inline-flex;
        align-items: center;
        gap: 7px;
        font-weight: 700;
      }

      .status::before {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        content: "";
      }

      .status.paid {
        color: var(--green);
      }

      .status.paid::before {
        background: var(--green);
      }

      .status.pending {
        color: var(--red);
      }

      .status.pending::before {
        background: var(--red);
      }

      @keyframes appear {
        from { opacity: 0; transform: translateY(12px); }
        to { opacity: 1; transform: translateY(0); }
      }

      @media (max-width: 640px) {
        body {
          padding: 16px;
        }

        .header {
          align-items: flex-start;
          flex-direction: column;
          padding: 22px;
        }

        .logout {
          width: 100%;
          text-align: center;
        }

        .card {
          padding: 22px 18px;
        }
      }
    </style>
  </head>
  <body>
    <main class="page">
      <div class="header">
        <div class="header-copy">
          <div class="header-mark">$</div>
          <div>
            <h1>Sistema de Gestión ERP</h1>
            <p>Módulo de cobros</p>
          </div>
        </div>
      <a href="/" class="logout">Cerrar Sesión</a>
      </div>

      <section class="card">
        <h2>Registros Recientes</h2>
        <p><i>Nota: Estos datos provendrán de AWS RDS próximamente.</i></p>

        <div class="table-wrapper">
          <table>
        <thead>
          <tr>
            <th>ID</th>
            <th>Cliente</th>
            <th>Estado</th>
            <th>Monto</th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <td>001</td>
            <td>Empresa Alpha S.A.C.</td>
            <td><span class="status paid">Pagado</span></td>
            <td>$1,500.00</td>
          </tr>
          <tr>
            <td>002</td>
            <td>Distribuidora Beta</td>
            <td><span class="status pending">Pendiente</span></td>
            <td>$850.00</td>
          </tr>
        </tbody>
          </table>
        </div>
      </section>
    </main>
  </body>
</html>
