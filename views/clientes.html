<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dashboard | Módulo de Cobros</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --ink: #172033;
        --muted: #687386;
        --line: #e4e8ed;
        --navy: #172b3a;
        --orange: #f28c28;
        --green: #18794e;
        --red: #b6413c;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        margin: 0;
        padding: 32px;
        color: var(--ink);
        font-family: "DM Sans", sans-serif;
        background: #eef2f4;
        background-image:
          radial-gradient(#c9d4d7 1px, transparent 1px),
          linear-gradient(135deg, #f8faf9, #e7edef);
        background-size:
          22px 22px,
          100% 100%;
      }

      .page {
        width: min(100%, 1120px);
        margin: 0 auto;
      }

      .header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 24px;
        padding: 25px 30px;
        border-radius: 16px;
        color: white;
        background: var(--navy);
        box-shadow: 0 16px 30px rgba(23, 43, 58, 0.18);
        animation: appear 500ms ease-out both;
      }

      .header-copy {
        display: flex;
        align-items: center;
        gap: 15px;
      }

      .header-mark {
        display: grid;
        width: 42px;
        height: 42px;
        flex: 0 0 42px;
        place-items: center;
        border-radius: 11px;
        color: var(--navy);
        background: var(--orange);
        font-family: "Space Grotesk", sans-serif;
        font-size: 20px;
        font-weight: 700;
      }

      .header h1 {
        margin: 0;
        font-family: "Space Grotesk", sans-serif;
        font-size: 21px;
      }

      .header p {
        margin: 4px 0 0;
        color: #b8c4cb;
        font-size: 13px;
      }

      .logout {
        padding: 11px 16px;
        border-radius: 8px;
        color: white;
        text-decoration: none;
        background: var(--orange);
        font-size: 14px;
        font-weight: 700;
        transition:
          background 180ms ease,
          transform 180ms ease;
      }

      .logout:hover {
        background: #d87517;
        transform: translateY(-1px);
      }

      .card {
        margin-top: 24px;
        padding: 30px;
        border: 1px solid rgba(255, 255, 255, 0.9);
        border-radius: 16px;
        background: rgba(255, 255, 255, 0.94);
        box-shadow: 0 18px 45px rgba(29, 47, 61, 0.1);
        animation: appear 500ms 100ms ease-out both;
      }

      .card h2 {
        margin: 0;
        font-family: "Space Grotesk", sans-serif;
        font-size: 24px;
      }

      .card > p {
        margin: 7px 0 24px;
        color: var(--muted);
        font-size: 14px;
      }

      .toolbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        margin-bottom: 18px;
      }

      .search {
        width: min(100%, 300px);
        padding: 11px 14px;
        border: 1px solid var(--line);
        border-radius: 8px;
        outline: none;
        color: var(--ink);
        background: #fbfcfd;
        font: inherit;
      }

      .search:focus,
      .field input:focus {
        border-color: var(--orange);
        box-shadow: 0 0 0 4px rgba(242, 140, 40, 0.14);
      }

      .primary-button,
      .secondary-button,
      .action-button {
        border: 0;
        border-radius: 8px;
        cursor: pointer;
        font:
          700 14px "DM Sans",
          sans-serif;
      }

      .primary-button {
        padding: 12px 18px;
        color: white;
        background: var(--orange);
      }

      .secondary-button {
        padding: 12px 18px;
        color: var(--ink);
        background: #e9eef0;
      }

      .form-panel {
        display: none;
        margin-bottom: 24px;
        padding: 20px;
        border: 1px solid var(--line);
        border-radius: 10px;
        background: #f8faf9;
      }

      .form-panel.visible {
        display: block;
      }

      .form-grid {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 15px;
      }

      .field label {
        display: block;
        margin-bottom: 6px;
        color: #303b4d;
        font-size: 13px;
        font-weight: 700;
      }

      .field input {
        width: 100%;
        padding: 11px 12px;
        border: 1px solid var(--line);
        border-radius: 8px;
        outline: none;
        font: inherit;
      }

      .form-actions {
        display: flex;
        gap: 10px;
        margin-top: 18px;
      }

      .action-button {
        padding: 8px 11px;
        color: var(--ink);
        background: #e9eef0;
      }

      .action-button.delete {
        color: var(--red);
        background: #f9e9e8;
      }

      .empty-state,
      .message {
        padding: 24px;
        color: var(--muted);
        text-align: center;
      }

      .message.error {
        color: var(--red);
      }

      .table-wrapper {
        overflow-x: auto;
        border: 1px solid var(--line);
        border-radius: 10px;
      }

      table {
        width: 100%;
        min-width: 580px;
        border-collapse: collapse;
      }

      th,
      td {
        padding: 16px 18px;
        text-align: left;
        border-bottom: 1px solid var(--line);
        font-size: 14px;
      }

      th {
        color: #667385;
        background: #f5f7f8;
        font-size: 12px;
        letter-spacing: 0.06em;
        text-transform: uppercase;
      }

      tbody tr:last-child td {
        border-bottom: 0;
      }

      tbody tr:hover {
        background: #fbfcfc;
      }

      .status {
        display: inline-flex;
        align-items: center;
        gap: 7px;
        font-weight: 700;
      }

      .status::before {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        content: "";
      }

      .status.paid {
        color: var(--green);
      }

      .status.paid::before {
        background: var(--green);
      }

      .status.pending {
        color: var(--red);
      }

      .status.pending::before {
        background: var(--red);
      }

      @keyframes appear {
        from {
          opacity: 0;
          transform: translateY(12px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      @media (max-width: 640px) {
        body {
          padding: 16px;
        }

        .header {
          align-items: flex-start;
          flex-direction: column;
          padding: 22px;
        }

        .logout {
          width: 100%;
          text-align: center;
        }

        .card {
          padding: 22px 18px;
        }

        .toolbar,
        .form-actions {
          align-items: stretch;
          flex-direction: column;
        }

        .search,
        .primary-button,
        .secondary-button {
          width: 100%;
        }

        .form-grid {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <main class="page">
      <div class="header">
        <div class="header-copy">
          <div class="header-mark">$</div>
          <div>
            <h1>Sistema de Gestión ERP</h1>
            <p>Módulo de cobros</p>
          </div>
        </div>
        <a href="/" class="logout">Cerrar Sesión</a>
      </div>

      <section class="card">
        <div class="toolbar">
          <div>
            <h2>Directorio de Clientes</h2>
            <p>Administra los clientes registrados en el sistema.</p>
          </div>
          <button class="primary-button" id="new-client" type="button">
            + Nuevo cliente
          </button>
        </div>

        <form class="form-panel" id="client-form">
          <div class="form-grid">
            <div class="field">
              <label for="cl_name">Nombre</label>
              <!-- Cambiamos los name y id -->
              <input id="cl_name" name="cl_name" required />
            </div>
            <div class="field">
              <label for="cl_email">Correo electrónico</label>
              <input id="cl_email" name="cl_email" type="email" required />
            </div>
            <div class="field">
              <label for="cl_phone">Teléfono</label>
              <input id="cl_phone" name="cl_phone" required />
            </div>
            <div class="field">
              <label for="cl_address">Dirección</label>
              <input id="cl_address" name="cl_address" required />
            </div>
          </div>
          <div class="form-actions">
            <button class="primary-button" type="submit">
              Guardar cliente
            </button>
            <button class="secondary-button" id="cancel-form" type="button">
              Cancelar
            </button>
          </div>
        </form>

        <div class="toolbar">
          <input
            class="search"
            id="search"
            type="search"
            placeholder="Buscar cliente..."
          />
        </div>

        <div class="table-wrapper">
          <table>
            <thead>
              <tr>
                <th>ID</th>
                <th>Cliente</th>
                <th>Correo</th>
                <th>Teléfono</th>
                <th>Dirección</th>
                <th>Acciones</th>
              </tr>
            </thead>
            <tbody id="client-list">
              <tr>
                <td class="message" colspan="6">Cargando clientes...</td>
              </tr>
            </tbody>
          </table>
        </div>
      </section>
    </main>
    <script>
      const form = document.getElementById("client-form");
      const clientList = document.getElementById("client-list");
      const search = document.getElementById("search");
      let clients = [];
      let editingId = null;

      const escapeHtml = (value) =>
        String(value ?? "").replace(
          /[&<>'"]/g,
          (character) =>
            ({
              "&": "&amp;",
              "<": "&lt;",
              ">": "&gt;",
              "'": "&#39;",
              '"': "&quot;",
            })[character],
        );

      const showMessage = (text, error = false) => {
        clientList.innerHTML = `<tr><td class="message${error ? " error" : ""}" colspan="6">${text}</td></tr>`;
      };

      const renderClients = () => {
        const term = search.value.toLowerCase();
        const filtered = clients.filter((client) =>
          [
            client.cl_name,
            client.cl_email,
            client.cl_phone,
            client.cl_address,
          ].some((value) => String(value).toLowerCase().includes(term)),
        );

        if (filtered.length === 0) {
          showMessage("No hay clientes que mostrar.");
          return;
        }

        clientList.innerHTML = filtered
          .map(
            (client) => `
          <tr>
            <td>${escapeHtml(client.cl_id)}</td>
            <td>${escapeHtml(client.cl_name)}</td>
            <td>${escapeHtml(client.cl_email)}</td>
            <td>${escapeHtml(client.cl_phone)}</td>
            <td>${escapeHtml(client.cl_address)}</td>
            <td>
              <button class="action-button" type="button" data-edit="${client.cl_id}">Editar</button>
              <button class="action-button delete" type="button" data-delete="${client.cl_id}">Eliminar</button>
            </td>
          </tr>
        `,
          )
          .join("");
      };

      const loadClients = async () => {
        try {
          const response = await fetch("/api/clientes");
          if (!response.ok) throw new Error();
          clients = await response.json();
          renderClients();
        } catch (error) {
          showMessage(
            "No se pudieron cargar los clientes. Revisa la conexión con PostgreSQL.",
            true,
          );
        }
      };

      const resetForm = () => {
        editingId = null;
        form.reset();
        form.classList.remove("visible");
      };

      document.getElementById("new-client").addEventListener("click", () => {
        editingId = null;
        form.reset();
        form.classList.add("visible");
        document.getElementById("cl_name").focus();
      });

      document
        .getElementById("cancel-form")
        .addEventListener("click", resetForm);
      search.addEventListener("input", renderClients);

      form.addEventListener("submit", async (event) => {
        event.preventDefault();
        const data = Object.fromEntries(new FormData(form));
        const url = editingId ? `/api/clientes/${editingId}` : "/api/clientes";
        const method = editingId ? "PUT" : "POST";

        try {
          const response = await fetch(url, {
            method,
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(data),
          });
          if (!response.ok) throw new Error();
          resetForm();
          await loadClients();
        } catch (error) {
          window.alert("No se pudo guardar el cliente.");
        }
      });

      clientList.addEventListener("click", async (event) => {
        const editButton = event.target.closest("[data-edit]");
        const deleteButton = event.target.closest("[data-delete]");

        if (editButton) {
          const client = clients.find(
            (item) => String(item.cl_id) === editButton.dataset.edit,
          );
          if (!client) return;
          editingId = client.cl_id;
          Object.entries(client).forEach(([key, value]) => {
            const input = form.elements[key];
            if (input) input.value = value;
          });
          form.classList.add("visible");
          document.getElementById("cl_name").focus();
        }

        if (deleteButton && window.confirm("¿Eliminar este cliente?")) {
          try {
            const response = await fetch(
              `/api/clientes/${deleteButton.dataset.delete}`,
              { method: "DELETE" },
            );
            if (!response.ok) throw new Error();
            await loadClients();
          } catch (error) {
            window.alert("No se pudo eliminar el cliente.");
          }
        }
      });

      loadClients();
    </script>
  </body>
</html>
