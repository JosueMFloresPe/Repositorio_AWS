<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Deudas | Módulo de Cobros</title>
    <!-- Agrega la imagen del icono de la pestaña AQUI -->
    <link rel="icon" href="" type="image/png">
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --ink: #172033;
        --muted: #687386;
        --line: #e4e8ed;
        --navy: #172b3a;
        --orange: #f28c28;
        --green: #18794e;
        --red: #b6413c;
      }
      * {
        box-sizing: border-box;
      }
      body {
        min-height: 100vh;
        margin: 0;
        padding: 32px;
        color: var(--ink);
        font-family: "DM Sans", sans-serif;
        background: #eef2f4;
        background-image:
          radial-gradient(#c9d4d7 1px, transparent 1px),
          linear-gradient(135deg, #f8faf9, #e7edef);
        background-size:
          22px 22px,
          100% 100%;
      }
      .page {
        width: min(100%, 1120px);
        margin: 0 auto;
      }
      .header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 24px;
        padding: 25px 30px;
        border-radius: 16px;
        color: white;
        background: var(--navy);
        box-shadow: 0 16px 30px rgba(23, 43, 58, 0.18);
        animation: appear 500ms ease-out both;
      }
      .header-copy {
        display: flex;
        align-items: center;
        gap: 15px;
      }
      .header-logo {
        display: block;
        width: 42px;
        height: 42px;
        flex: 0 0 42px;
        border-radius: 11px;
        object-fit: cover;
        background-color: white;
        box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
      }
      .header h1 {
        margin: 0;
        font-family: "Space Grotesk", sans-serif;
        font-size: 21px;
      }
      .header p {
        margin: 4px 0 0;
        color: #b8c4cb;
        font-size: 13px;
      }

      .nav-links {
        display: flex;
        gap: 15px;
        align-items: center;
      }
      .nav-button {
        padding: 11px 16px;
        border-radius: 8px;
        color: white;
        text-decoration: none;
        font-size: 14px;
        font-weight: 700;
        transition: background 180ms ease;
      }
      .nav-button.active {
        background: rgba(255, 255, 255, 0.1);
      }
      .logout {
        background: var(--orange);
      }
      .logout:hover {
        background: #d87517;
        transform: translateY(-1px);
      }

      .card {
        margin-top: 24px;
        padding: 30px;
        border: 1px solid rgba(255, 255, 255, 0.9);
        border-radius: 16px;
        background: rgba(255, 255, 255, 0.94);
        box-shadow: 0 18px 45px rgba(29, 47, 61, 0.1);
        animation: appear 500ms 100ms ease-out both;
      }
      .card h2 {
        margin: 0;
        font-family: "Space Grotesk", sans-serif;
        font-size: 24px;
      }
      .card > p {
        margin: 7px 0 24px;
        color: var(--muted);
        font-size: 14px;
      }
      .toolbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        margin-bottom: 18px;
      }
      .search {
        width: min(100%, 300px);
        padding: 11px 14px;
        border: 1px solid var(--line);
        border-radius: 8px;
        outline: none;
        color: var(--ink);
        background: #fbfcfd;
        font: inherit;
      }
      .search:focus,
      .field input:focus,
      .field select:focus {
        border-color: var(--orange);
        box-shadow: 0 0 0 4px rgba(242, 140, 40, 0.14);
      }

      .primary-button,
      .secondary-button,
      .action-button {
        border: 0;
        border-radius: 8px;
        cursor: pointer;
        font:
          700 14px "DM Sans",
          sans-serif;
      }
      .primary-button {
        padding: 12px 18px;
        color: white;
        background: var(--orange);
      }
      .secondary-button {
        padding: 12px 18px;
        color: var(--ink);
        background: #e9eef0;
      }
      .form-panel {
        display: none;
        margin-bottom: 24px;
        padding: 20px;
        border: 1px solid var(--line);
        border-radius: 10px;
        background: #f8faf9;
      }
      .form-panel.visible {
        display: block;
      }
      .form-grid {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 15px;
      }
      .field label {
        display: block;
        margin-bottom: 6px;
        color: #303b4d;
        font-size: 13px;
        font-weight: 700;
      }
      .field input,
      .field select {
        width: 100%;
        padding: 11px 12px;
        border: 1px solid var(--line);
        border-radius: 8px;
        outline: none;
        font: inherit;
        background: white;
      }
      .form-actions {
        display: flex;
        gap: 10px;
        margin-top: 18px;
      }
      .action-button {
        padding: 8px 11px;
        color: var(--ink);
        background: #e9eef0;
      }
      .action-button.delete {
        color: var(--red);
        background: #f9e9e8;
      }
      .empty-state,
      .message {
        padding: 24px;
        color: var(--muted);
        text-align: center;
      }
      .message.error {
        color: var(--red);
      }
      .table-wrapper {
        overflow-x: auto;
        border: 1px solid var(--line);
        border-radius: 10px;
      }
      table {
        width: 100%;
        min-width: 580px;
        border-collapse: collapse;
      }
      th,
      td {
        padding: 16px 18px;
        text-align: left;
        border-bottom: 1px solid var(--line);
        font-size: 14px;
      }
      th {
        color: #667385;
        background: #f5f7f8;
        font-size: 12px;
        letter-spacing: 0.06em;
        text-transform: uppercase;
      }
      tbody tr:last-child td {
        border-bottom: 0;
      }
      tbody tr:hover {
        background: #fbfcfc;
      }

      .status {
        display: inline-flex;
        align-items: center;
        gap: 7px;
        font-weight: 700;
        font-size: 12px;
        padding: 4px 10px;
        border-radius: 20px;
        background: #f0f0f0;
      }
      .status::before {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        content: "";
      }
      .status.pagado {
        color: var(--green);
        background: #e6f4ea;
      }
      .status.pagado::before {
        background: var(--green);
      }
      .status.pendiente {
        color: var(--orange);
        background: #fef4e6;
      }
      .status.pendiente::before {
        background: var(--orange);
      }
      .status.vencido {
        color: var(--red);
        background: #fce8e6;
      }
      .status.vencido::before {
        background: var(--red);
      }

      @keyframes appear {
        from {
          opacity: 0;
          transform: translateY(12px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
      @media (max-width: 640px) {
        body {
          padding: 16px;
        }
        .header {
          align-items: flex-start;
          flex-direction: column;
          padding: 22px;
        }
        .nav-links {
          width: 100%;
          justify-content: space-between;
        }
        .card {
          padding: 22px 18px;
        }
        .toolbar,
        .form-actions {
          align-items: stretch;
          flex-direction: column;
        }
        .search,
        .primary-button,
        .secondary-button {
          width: 100%;
        }
        .form-grid {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <main class="page">
      <div class="header">
        <div class="header-copy">
          <!-- Agrega la imagen del logo AQUI -->
          <img src="" alt="Logo S3" class="header-logo" />
          <div>
            <h1>Sistema de Gestión ERP</h1>
            <p>Módulo de cobros</p>
          </div>
        </div>
        <div class="nav-links">
          <a href="/clientes" class="nav-button active">Directorio Clientes</a>
          <a href="/deudas" class="nav-button">Gestión Deudas</a>
          <a href="/" class="nav-button logout">Salir</a>
        </div>
      </div>

      <section class="card">
        <div class="toolbar">
          <div>
            <h2>Gestión de Deudas</h2>
            <p>Registra y controla los cobros pendientes de los clientes.</p>
          </div>
          <button class="primary-button" id="new-debt" type="button">
            + Nueva Deuda
          </button>
        </div>

        <form class="form-panel" id="debt-form">
          <div class="form-grid">
            <div class="field">
              <label for="clients_id">Cliente</label>
              <!-- Este select se llenará con JS -->
              <select id="clients_id" name="clients_id" required>
                <option value="">Selecciona un cliente...</option>
              </select>
            </div>
            <div class="field">
              <label for="dt_amount">Monto de la deuda ($)</label>
              <input
                id="dt_amount"
                name="dt_amount"
                type="number"
                step="0.01"
                min="0"
                required
              />
            </div>
            <div class="field">
              <label for="dt_status">Estado de pago</label>
              <select id="dt_status" name="dt_status" required>
                <option value="PENDIENTE">Pendiente</option>
                <option value="PAGADO">Pagado</option>
                <option value="VENCIDO">Vencido</option>
              </select>
            </div>
            <div class="field">
              <label for="due_date">Fecha de Vencimiento</label>
              <input id="due_date" name="due_date" type="date" required />
            </div>
          </div>
          <div class="form-actions">
            <button class="primary-button" type="submit">
              Guardar registro
            </button>
            <button class="secondary-button" id="cancel-form" type="button">
              Cancelar
            </button>
          </div>
        </form>

        <div class="toolbar">
          <input
            class="search"
            id="search"
            type="search"
            placeholder="Buscar por cliente o estado..."
          />
        </div>

        <div class="table-wrapper">
          <table>
            <thead>
              <tr>
                <th>ID</th>
                <th>Cliente</th>
                <th>Monto</th>
                <th>Estado</th>
                <th>Vencimiento</th>
                <th>Acciones</th>
              </tr>
            </thead>
            <tbody id="debt-list">
              <tr>
                <td class="message" colspan="6">Cargando registros...</td>
              </tr>
            </tbody>
          </table>
        </div>
      </section>
    </main>

    <script>
      const form = document.getElementById("debt-form");
      const debtList = document.getElementById("debt-list");
      const clientSelect = document.getElementById("clients_id");
      const search = document.getElementById("search");

      let debts = [];
      let editingId = null;

      const escapeHtml = (value) =>
        String(value ?? "").replace(
          /[&<>'"]/g,
          (c) =>
            ({
              "&": "&amp;",
              "<": "&lt;",
              ">": "&gt;",
              "'": "&#39;",
              '"': "&quot;",
            })[c],
        );

      const formatDate = (dateString) => {
        if (!dateString) return "-";
        const date = new Date(dateString);
        return date.toLocaleDateString("es-ES");
      };

      const formatInputDate = (dateString) => {
        if (!dateString) return "";
        const date = new Date(dateString);
        return date.toISOString().split("T")[0];
      };

      const showMessage = (text, error = false) => {
        debtList.innerHTML = `<tr><td class="message${error ? " error" : ""}" colspan="6">${text}</td></tr>`;
      };

      const loadClientsForSelect = async () => {
        try {
          const res = await fetch("/api/clientes");
          const clients = await res.json();
          clients.forEach((client) => {
            const option = document.createElement("option");
            option.value = client.cl_id;
            option.textContent = client.cl_name;
            clientSelect.appendChild(option);
          });
        } catch (error) {
          console.error("Error al cargar clientes para el select", error);
        }
      };

      const renderDebts = () => {
        const term = search.value.toLowerCase();
        const filtered = debts.filter((debt) =>
          [debt.cl_name, debt.dt_status, String(debt.dt_amount)].some((val) =>
            String(val).toLowerCase().includes(term),
          ),
        );

        if (filtered.length === 0) {
          showMessage("No hay deudas que mostrar.");
          return;
        }

        debtList.innerHTML = filtered
          .map(
            (debt) => `
          <tr>
            <td>${escapeHtml(debt.dt_id)}</td>
            <td><strong>${escapeHtml(debt.cl_name)}</strong></td>
            <td>$${parseFloat(debt.dt_amount).toFixed(2)}</td>
            <td>
              <span class="status ${debt.dt_status.toLowerCase()}">${escapeHtml(debt.dt_status)}</span>
            </td>
            <td>${formatDate(debt.due_date)}</td>
            <td>
              <button class="action-button" type="button" data-edit="${debt.dt_id}">Editar</button>
              <button class="action-button delete" type="button" data-delete="${debt.dt_id}">Eliminar</button>
            </td>
          </tr>
        `,
          )
          .join("");
      };

      const loadDebts = async () => {
        try {
          const response = await fetch("/api/deudas");
          if (!response.ok) throw new Error();
          debts = await response.json();
          renderDebts();
        } catch (error) {
          showMessage("No se pudieron cargar las deudas.", true);
        }
      };

      const resetForm = () => {
        editingId = null;
        form.reset();
        form.classList.remove("visible");
      };

      document.getElementById("new-debt").addEventListener("click", () => {
        editingId = null;
        form.reset();
        form.classList.add("visible");
        clientSelect.focus();
      });

      document
        .getElementById("cancel-form")
        .addEventListener("click", resetForm);
      search.addEventListener("input", renderDebts);

      form.addEventListener("submit", async (event) => {
        event.preventDefault();
        const data = Object.fromEntries(new FormData(form));
        const url = editingId ? `/api/deudas/${editingId}` : "/api/deudas";
        const method = editingId ? "PUT" : "POST";

        try {
          const response = await fetch(url, {
            method,
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(data),
          });
          if (!response.ok) throw new Error();
          resetForm();
          await loadDebts();
        } catch (error) {
          window.alert("No se pudo guardar la deuda.");
        }
      });

      debtList.addEventListener("click", async (event) => {
        const editButton = event.target.closest("[data-edit]");
        const deleteButton = event.target.closest("[data-delete]");

        if (editButton) {
          const debt = debts.find(
            (item) => String(item.dt_id) === editButton.dataset.edit,
          );
          if (!debt) return;
          editingId = debt.dt_id;

          form.elements["clients_id"].value = debt.clients_id;
          form.elements["dt_amount"].value = debt.dt_amount;
          form.elements["dt_status"].value = debt.dt_status;
          form.elements["due_date"].value = formatInputDate(debt.due_date);

          form.classList.add("visible");
        }

        if (
          deleteButton &&
          window.confirm("¿Eliminar este registro de deuda?")
        ) {
          try {
            const response = await fetch(
              `/api/deudas/${deleteButton.dataset.delete}`,
              { method: "DELETE" },
            );
            if (!response.ok) throw new Error();
            await loadDebts();
          } catch (error) {
            window.alert("No se pudo eliminar la deuda.");
          }
        }
      });

      loadClientsForSelect();
      loadDebts();
    </script>
  </body>
</html>
